name: Build

# A push to main that changes the pins or the build publishes a release
# tagged ${FFMPEG_VERSION}-${BUILD}. Pull requests build and smoke-test
# without publishing. Bump PRs are opened by Actions and get no automatic run,
# so run this by hand (workflow_dispatch) on their branch.
on:
  push:
    branches: [main]
    paths:
      - versions.env
      - build.sh
      - tests/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - versions.env
      - build.sh
      - tests/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            triple: aarch64-apple-darwin
            runner: ""
          - arch: x86_64
            triple: x86_64-apple-darwin
            runner: arch -x86_64
    steps:
      - uses: actions/checkout@v5
      - name: Build tools
        run: brew install nasm meson ninja pkg-config
      - name: Runner image
        id: image
        run: echo "id=${ImageOS:-macos}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cached build
        id: cache
        uses: actions/cache@v4
        with:
          path: dist
          # The runner image and the workflow are part of the build too.
          key: ffmpeg-${{ matrix.arch }}-${{ steps.image.outputs.id }}-${{ hashFiles('versions.env', 'build.sh', '.github/workflows/build.yml') }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./build.sh ${{ matrix.arch }}
      - name: Smoke test
        run: tests/smoke.sh dist/ffmpeg-${{ matrix.triple }}.zip "${{ matrix.runner }}"
      - name: Size
        run: ls -la dist
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source versions.env
          tag="${FFMPEG_VERSION}-${BUILD}"
          expected="ffmpeg-aarch64-apple-darwin.zip ffmpeg-x86_64-apple-darwin.zip ffmpeg-LICENSE-and-SOURCE.txt SHA256SUMS"
          if state=$(gh release view "$tag" --json isDraft,assets --jq '[.isDraft, ([.assets[].name] | join(" "))] | @tsv' 2>/dev/null); then
            draft=${state%%$'\t'*}
            names=${state#*$'\t'}
            if [ "$draft" = true ]; then
              # A run that failed part-way: start that release over.
              gh release delete "$tag" --yes
            else
              for name in $expected; do
                case " $names " in
                  *" $name "*) ;;
                  *) echo "release $tag is published but lacks $name: fix it by hand" >&2; exit 1 ;;
                esac
              done
              echo "release $tag is complete; bump BUILD in versions.env to publish again"
              exit 0
            fi
          fi
          cd dist
          sha256sum -- *.zip ffmpeg-LICENSE-and-SOURCE.txt > SHA256SUMS
          cat SHA256SUMS
          # Draft first, publish once every file is up: a failed upload never
          # leaves a published release with files missing.
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "ffmpeg $tag" \
            --notes "Static ffmpeg + ffprobe ${FFMPEG_VERSION} for macOS (Apple silicon and Intel), build ${BUILD}. GPL-2.0-or-later; sources in ffmpeg-LICENSE-and-SOURCE.txt." \
            ./*.zip ffmpeg-LICENSE-and-SOURCE.txt SHA256SUMS
          gh release edit "$tag" --draft=false --latest
